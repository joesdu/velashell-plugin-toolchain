# 插件工具链的发布流水线:在 GitHub 页面**发布 Release** 时自动触发。
#
# 一次发布同时产出两类东西,共用 Release 标签里的那个版本号:
#
#   ① 五个 NuGet 包 —— 推到 nuget.org
#      VelaShell.PluginSdk           契约程序集(插件与宿主唯一共享的类型)
#      VelaShell.PluginSdk.Testing   测试替身(TestPluginContext 与各能力内存实现)
#      VelaShell.PluginSdk.Build     插件工程引用的那一个包(targets + 打包器 + 依赖锁)
#      VelaShell.Plugin.Cli          dotnet tool `vela-plugin`
#      VelaShell.Plugin.Templates    dotnet new 模板(velaplugin / velaplugin-ui)
#
#   ② 第一方插件的分发物 —— 挂到 Release 资产上
#      velashell-plugins-<版本>.zip  主程序安装包里 plugins/ 那一层的一比一布局。
#                                    VelaShell 主仓库发版时按 pin 的版本下载它、解进发布目录
#                                    (见主仓库 Directory.Build.props 的 VelaPluginsBundleVersion)。
#      *.vpx                         每个插件一份,供用户手工安装 / 作插件商店的源。
#
# ⚠️ 发版方式(2026-08-21 起):**发 Release,不再打 sdk-v* 标签**。
#    以前是 `git tag sdk-v1.0.0 && git push` 由标签事件触发;现在统一走 Release ——
#    理由有三:
#      · 版本号、发布说明、产物三者在同一个页面上,回看一次发布不用在标签和 Actions 之间来回跳;
#      · 插件分发包必须挂在某个 Release 上才有稳定下载地址(主仓库要按版本取它),
#        而"打标签"本身不产生 Release;
#      · 预发布可以用 Release 的 prerelease 勾选表达,不必再靠版本号后缀去猜。
#    标签名带不带 v 前缀都行(下面会 TrimStart),建议统一 `v1.4.0`。
#
# 📌 版本号不用手工改了(2026-08-21 起):标签解析出来之后,流水线**第一件事**就是跑
#    scripts/Set-Version.ps1,把该版本写进 Directory.Build.props、两个模板的
#    template.json、VelaPluginApi.SdkVersion 以及四份文档的版本横幅/PackageReference 片段。
#    发布成功后由 sync-main 任务开一个 PR 把这些改动回写 main(等你手动合)。所以发版只剩三步:
#      ① 破坏性变更才需要先手工 +1 VelaPluginApi.Level(改没改是人的判断,脚本会核对但不代改)
#      ② 合进 main
#      ③ 在 GitHub 上发 Release,标签填 v<版本>
#    发完之后会多出一个 chore/version-<版本> 的 PR,内容就是那些版本号替换 —— 合掉即可。
#
# 推送用 **NuGet Trusted Publishing(OIDC)**,不存 API Key:
#   NuGet/login 拿本次运行的 GitHub OIDC 令牌去 nuget.org 换一把**短时效**的推送密钥,
#   用完即弃。密钥不落仓库机密,也就没有"泄漏了要轮换"这件事。
#   ⚠️ 拆库之后 nuget.org 上那五条策略必须改:仓库所有者/仓库名/工作流文件名三项都变了。
#      改法见 docs/release-process.md 的"NuGet 可信发布"一节。
#
# 需要的仓库机密:
#   STRONG_NAME_KEY   与 VelaShell 主仓库**同一把**:Release 下 SDK 程序集要强名称签名,
#                     否则宿主(已签名)引用不了它。(推送本身不再需要任何机密。)
#   VERSION_SYNC_TOKEN(可选)细粒度 PAT(contents + pull requests 写权限)。不配就用
#                     GITHUB_TOKEN,一切照常 —— 唯一区别是 GITHUB_TOKEN 开出来的
#                     版本同步 PR 不会触发 CI(GitHub 防工作流自循环的既定行为)。
#
# 发布前会先跑全量测试与**模板端到端冒烟**(装模板 → 生成工程 → 还原 → 构建 → 出 .vpx)。
# 那一步不是形式:插件工程是仓库外环境,仓库内的 Directory.Build.props 一条也吃不到 ——
# 历史上正是它先发现了"SDK 带 RequiresPreviewFeatures,插件工程不开预览开关就全线 CA2252"
# 以及"NuGet 默认不传递 build 资产,导致 Avalonia 的 AXAML 编译器到不了插件工程"这两个坑。
name: Release

on:
  release:
    types: [published]
  # 手动兜底:release 事件没能触发时(主仓库 2026-08-07 遇到过一次),在 Actions 页面
  # 选本工作流 → Run workflow → 填标签即可补跑。推送用 --skip-duplicate、资产上传用
  # `gh release upload --clobber`,对同一标签重复跑是幂等的。
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 Release 标签(如 v1.4.0)'
        required: true
        type: string
      dryRun:
        description: '只打包与冒烟,不推送 nuget.org、不上传 Release 资产'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  # Trusted Publishing 的前提:没有它,NuGet/login 拿不到 OIDC 令牌,换密钥这一步会直接失败。
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    # 供 sync-main 回写时复用,免得把标签解析逻辑抄第二遍。
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name || inputs.tag }}'
          if ([string]::IsNullOrWhiteSpace($tag)) { Write-Error "No release tag available."; exit 1 }
          $version = $tag.TrimStart('v')
          # 版本号必须是合法 SemVer:打错标签(比如 "release-2")的话,下面五个包会以一个
          # 谁也想不到的版本号推上 nuget.org,而 nuget.org 的包版本**不可删除、不可覆盖**。
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            Write-Error "Release tag '$tag' does not resolve to a SemVer version (got '$version'). Use e.g. v1.4.0 or v1.4.0-preview.1."
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing version $version (tag $tag)"

      # ── 把标签里的版本号写进仓库 ─────────────────────────────────────────────
      # 发版清单里"改 Directory.Build.props、改两个 template.json、改 VelaPluginApi.SdkVersion、
      # 改四份文档的版本横幅与 PackageReference 片段"这七八处,以前全靠人在合 main 之前记着改。
      # 漏一处的后果并不对称:模板漏了会在插件作者的构建期炸 VELA1004;
      # VelaPluginApi.SdkVersion 漏了**什么都不会报错**,只是 `vela-plugin doctor` 从此
      # 汇报一个错的宿主 SDK 版本。所以这件事交给脚本,并且放在**构建之前的第一步** ——
      # 产物因此永远与 Release 标签一致,与仓库里当时提交了什么无关。
      # 改动会在发布成功后由 sync-main 任务以 PR 形式回写 main(见文件末尾),等人合。
      - name: Stamp version into the repo
        shell: pwsh
        run: |
          & ./scripts/Set-Version.ps1 '${{ steps.version.outputs.version }}'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git --no-pager diff --stat

      # 强名称密钥。缺了它 Release 构建会在 CSC 那一步失败(找不到 .snk),
      # 而那条报错离根因很远 —— 这里先给一句人话。
      - name: Restore strong-name key
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SNK_B64)) {
            Write-Error "STRONG_NAME_KEY secret is missing; SDK assemblies must be strong-name signed with the same key as the VelaShell host."
            exit 1
          }
          [IO.File]::WriteAllBytes("VelaShell.snk", [Convert]::FromBase64String($env:SNK_B64))
        env:
          SNK_B64: ${{ secrets.STRONG_NAME_KEY }}

      # ⚠️ 必须是 Debug,别改成 Release:Release 会打开强名签名(见 plugin-sdk/Directory.Build.props),
      #    而签名程序集的 InternalsVisibleTo 必须带友元公钥、友元也得用同一把钥匙签名 ——
      #    测试程序集两条都不满足。这些用例验的是契约与插件逻辑,与优化级别无关,Debug 等价;
      #    且 Debug 的 obj/bin 与下面 Pack 的 Release 目录彼此隔离,
      #    不会把未签名产物混进要发布的包里。
      - name: Test
        shell: pwsh
        run: |
          dotnet test VelaShell.PluginToolchain.slnx -c Debug --nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Pack
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force artifacts/nuget | Out-Null
          $projects = @(
            'plugin-sdk/VelaShell.PluginSdk/VelaShell.PluginSdk.csproj',
            'plugin-sdk/VelaShell.PluginSdk.Testing/VelaShell.PluginSdk.Testing.csproj',
            'tools/VelaShell.Plugin.Cli/VelaShell.Plugin.Cli.csproj',
            'plugin-sdk/VelaShell.PluginSdk.Build/VelaShell.PluginSdk.Build.csproj',
            'templates/VelaShell.Plugin.Templates.csproj'
          )
          foreach ($project in $projects) {
            dotnet pack $project -c Release -o artifacts/nuget -p:VelaSdkVersion=$version --nologo
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Get-ChildItem artifacts/nuget | Select-Object -ExpandProperty Name

      # 端到端冒烟:完全站在插件作者的位置上 —— 从刚打出的包装模板、生成工程、
      # 还原、构建、出 .vpx,最后确认包能被容器读回来。任何一步失败都不该发出去。
      - name: Smoke test (template -> build -> .vpx)
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $feed = (Resolve-Path artifacts/nuget).Path
          $work = Join-Path $env:RUNNER_TEMP 'sdk-smoke'
          New-Item -ItemType Directory -Force $work | Out-Null
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$feed" />
              <add key="nuget" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          "@ | Set-Content (Join-Path $work 'nuget.config')

          dotnet new install "$feed/VelaShell.Plugin.Templates.$version.nupkg"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          try {
            Push-Location $work
            dotnet new velaplugin-ui -n Smoke --publisher ci --authorName "CI" --sdkVersion $version
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Push-Location (Join-Path $work 'Smoke')
            dotnet build -c Release -t:PackVpx --nologo
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $vpx = Get-ChildItem bin/vpx/*.vpx | Select-Object -First 1
            if (-not $vpx) { throw "PackVpx produced no package." }
            # 用刚打出的 CLI 复核一遍容器:魔数、摘要、清单都要读得回来。
            dotnet "$env:GITHUB_WORKSPACE/tools/VelaShell.Plugin.Cli/bin/Release/net11.0/VelaShell.Plugin.Cli.dll" info $vpx.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
            # 插件输出目录里绝不能出现共享程序集 —— 出现了就说明 exclude=Runtime 的链路断了。
            $leaked = Get-ChildItem bin/Release/net11.0 -Filter '*.dll' |
              Where-Object { $_.Name -like 'Avalonia*' -or $_.Name -eq 'VelaShell.PluginSdk.dll' }
            if ($leaked) { throw "Shared assemblies leaked into the plugin output: $($leaked.Name -join ', ')" }
            Pop-Location
            Pop-Location
          } finally {
            dotnet new uninstall VelaShell.Plugin.Templates
          }

      # 第一方插件的分发物。布局与校验规则见 build/PluginBundle.proj。
      # 插件是纯托管、无 RID 的产物,一个包吃遍五个平台,不必按 RID 分。
      - name: Build first-party plugin bundle
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          dotnet build build/PluginBundle.proj -c Release -t:Bundle -p:BundleDir="$PWD/artifacts/plugins-bundle" --nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path artifacts/plugins-bundle/* -DestinationPath "artifacts/release/velashell-plugins-$version.zip" -Force
          dotnet build build/PluginBundle.proj -c Release -t:PackAllVpx -p:VpxDir="$PWD/artifacts/vpx" --nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item artifacts/vpx/*.vpx artifacts/release/
          Get-ChildItem artifacts/release | Select-Object Name, Length

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          Push-Location artifacts/release
          Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Sort-Object | Set-Content SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Pop-Location

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/nuget/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: plugin-release-assets
          path: artifacts/release/*
          if-no-files-found: error

      # Trusted Publishing:用本次运行的 OIDC 身份换一把短时效推送密钥。
      # 换不到密钥基本只有一个原因 —— nuget.org 上那条策略的 Repository / Workflow 字段
      # 还停在拆库之前的值。详见 docs/release-process.md。
      - name: NuGet login (trusted publishing)
        id: nuget-login
        if: ${{ !inputs.dryRun }}
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || 'joes_du' }}

      - name: Push to nuget.org
        if: ${{ !inputs.dryRun }}
        shell: pwsh
        run: |
          # --skip-duplicate:同一版本重跑不算失败(手动补跑是常规操作)。
          # .snupkg 与同名 .nupkg 在同一目录时由 dotnet nuget push 顺带一并推送,无需单列。
          #
          # ⚠️ 通配符必须自己展开:dotnet nuget push **不做 glob 扩展**,把
          #    "artifacts/nuget/*.nupkg" 整个当成文件名去找,报 "File does not exist"
          #    —— 1.0.0-preview.1 的首发就是卡在这一步。
          $packages = @(Get-ChildItem artifacts/nuget/*.nupkg)
          if ($packages.Count -eq 0) { throw "No .nupkg found in artifacts/nuget." }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_TOKEN --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
        env:
          NUGET_TOKEN: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      # 插件分发物挂到 Release 上。主仓库发版时按固定地址取 zip:
      #   releases/download/<tag>/velashell-plugins-<版本>.zip
      - name: Upload plugin assets to release
        if: ${{ !inputs.dryRun }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem artifacts/release -File | ForEach-Object FullName
          gh release upload '${{ steps.version.outputs.tag }}' @assets --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit 1 }
        env:
          GH_TOKEN: ${{ github.token }}

  # ── 把版本号回写 main(以 PR 的形式)────────────────────────────────────────
  # 上面那个 Stamp 步骤只改了 runner 上的工作区 —— 包已经发出去了,但仓库里的
  # Directory.Build.props / template.json / VelaPluginApi.SdkVersion / 四份文档
  # 还停在上一版。不回写的话,下一个克隆仓库的人看到的版本号是错的,
  # 而且 CI 的 `Set-Version.ps1 -Check` 会一直红着。
  #
  # **开 PR 而不是直推 main**:main 迟早要开分支保护,直推那条路会被挡死;而且
  # 版本号回写是"机器人改了你仓库里的代码",过一遍 PR 让人看一眼再合,本来就更合适。
  # 分支名 chore/version-<版本> 是确定的,所以手动补跑同一个标签会更新同一个 PR,
  # 不会攒出一堆。
  #
  # 单独一个 job 而不是接在 publish 后面:publish 的工作区检出在**标签**上、
  # 且已被构建产物弄脏,在那里 checkout main 会把两者搅在一起。这里从干净的
  # main 重新跑一遍脚本,结果与 publish 里那次逐字节相同(脚本是纯函数)。
  sync-main:
    needs: publish
    if: ${{ !inputs.dryRun }}
    runs-on: ubuntu-latest
    # job 级 permissions 会**整体覆盖**工作流级的那份,所以 contents 要重写一遍;
    # 这个 job 用不到 id-token(不推 nuget.org),顺手收窄。
    permissions:
      contents: write
      pull-requests: write
    steps:
      # VERSION_SYNC_TOKEN 是**可选**的:没配就用 github.token,一切照常,唯一区别是
      # GITHUB_TOKEN 开出来的 PR **不会触发 CI**(GitHub 防工作流自循环的既定行为)。
      # 那条 PR 的内容是纯版本号替换、且刚在上面的发布里全量验过,合并时 main 上的
      # push 又会正常跑一遍 CI,所以不配也是安全的。想让 PR 本身也亮绿灯,
      # 配一个有 contents+pull-requests 权限的 PAT 即可。
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.VERSION_SYNC_TOKEN || github.token }}

      - name: Open version-sync PR
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.VERSION_SYNC_TOKEN || github.token }}
        run: |
          $version = '${{ needs.publish.outputs.version }}'
          $branch = "chore/version-$version"

          & ./scripts/Set-Version.ps1 $version
          if ($LASTEXITCODE -ne 0) { exit 1 }

          if (-not (git status --porcelain)) {
            Write-Host "::notice::main 里的版本号已经是 $version,无需回写。"
            exit 0
          }

          # 回写失败不该让一次已经成功的发布显示成红的 —— 包在 nuget.org 上、资产在
          # Release 上,都已经是既成事实。这里整段降级成警告,把手工补救的命令给出来。
          #
          # try/catch 与 $LASTEXITCODE 两道都要:GitHub 给 pwsh 步骤预置了
          # $ErrorActionPreference='stop',而 PowerShell 7.4 起
          # $PSNativeCommandUseErrorActionPreference 默认为 true —— 原生命令返回非零会
          # **抛异常**,只写 if ($LASTEXITCODE) 的话根本走不到。
          try {
            git config user.name  'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git checkout -b $branch
            git commit -am "chore: 版本号同步到 $version"
            # --force:分支名由版本号决定,补跑时内容是从干净 main 重新生成的,
            # 强推等于"把这个 PR 刷新到最新",不存在要保留的历史。
            git push --force origin $branch
            if ($LASTEXITCODE -ne 0) { throw "推送 $branch 失败。" }

            # `// empty` 不是装饰:没有匹配的 PR 时 `.[0].url` 求值为 null,而 jq 会把它
            # 原样打成字符串 "null" —— 在 PowerShell 里那是**真值**,会让下面误判成"PR 已存在"。
            $existing = gh pr list --head $branch --state open --json url --jq '.[0].url // empty'
            if ($existing) {
              Write-Host "::notice::版本同步 PR 已存在,已刷新到最新:$existing"
              exit 0
            }

            # 不用 here-string:YAML 块标量里每行都带缩进,而 PowerShell 要求 @" 的
            # 结束符顶格,两者不可调和。用数组拼。
            $body = @(
              "本次发布(``$version``)的版本号回写。由 ``.github/workflows/release.yml`` 的 sync-main 任务生成。"
              ""
              "内容是 ``pwsh scripts/Set-Version.ps1 $version`` 的输出 —— 纯版本号替换,不含任何其它改动。"
              "同一份改动已经在发布流水线里构建、测试、模板端到端冒烟全过一遍了(包也已经推上 nuget.org)。"
              ""
              "**合掉它**,否则 CI 的版本同步体检(``Set-Version.ps1 -Check``)会一直红着,"
              "而且下一个克隆仓库的人看到的版本号是错的。"
            ) -join "`n"

            $url = gh pr create --base main --head $branch --title "chore: 版本号同步到 $version" --body $body
            if ($LASTEXITCODE -ne 0) { throw "gh pr create 失败。" }
            Write-Host "::notice::已开出版本同步 PR:$url"
          } catch {
            Write-Host $_.Exception.Message
            Write-Host "::warning::版本号回写 PR 没能开出来。发布本身已成功;请在本地跑 ``pwsh scripts/Set-Version.ps1 $version`` 后自行提 PR 合进 main,否则 CI 的版本同步体检会一直失败。"
            exit 0
          }
