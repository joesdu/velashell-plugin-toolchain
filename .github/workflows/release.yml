# 插件工具链的发布流水线:在 GitHub 页面**发布 Release** 时自动触发。
#
# 一次发布产出五个 NuGet 包,推到 nuget.org,共用 Release 标签里的那个版本号:
#
#      VelaShell.PluginSdk           契约程序集(插件与宿主唯一共享的类型)
#      VelaShell.PluginSdk.Testing   测试替身(TestPluginContext 与各能力内存实现)
#      VelaShell.PluginSdk.Build     插件工程引用的那一个包(targets + 打包器 + 依赖锁)
#      VelaShell.Plugin.Cli          dotnet tool `vela-plugin`
#      VelaShell.Plugin.Templates    dotnet new 模板(velaplugin / velaplugin-ui)
#
# 第一方插件**不在这里发**:插件已搬去 joesdu/velashell-plugins,那个仓库有自己的
# Release 流水线,产出 velashell-plugins-<版本>.zip 与各插件的 .vpx。主仓库按
# VelaPluginsBundleVersion 去那边取。本流水线只管 SDK 与工具链。
#
# ⚠️ 发版方式(2026-08-21 起):**发 Release,不再打 sdk-v* 标签**。
#    以前是 `git tag sdk-v1.0.0 && git push` 由标签事件触发;现在统一走 Release ——
#    理由有二:
#      · 版本号、发布说明、产物三者在同一个页面上,回看一次发布不用在标签和 Actions 之间来回跳;
#      · 预发布可以用 Release 的 prerelease 勾选表达,不必再靠版本号后缀去猜。
#    标签名带不带 v 前缀都行(下面会 TrimStart),建议统一 `v1.4.0`。
#
# 📌 版本号:**发版前在本地落好、随功能改动一起合进 main**(2026-08-26 起)。
#    跑一次 `pwsh scripts/Set-Version.ps1 <版本>`,它会把该版本写进 Directory.Build.props、
#    两个模板的 template.json、VelaPluginApi.SdkVersion 以及四份文档的版本横幅/
#    PackageReference 片段 —— 十来处,漏一处的后果见脚本头注释。所以发版三步:
#      ① 破坏性变更才需要先手工 +1 VelaPluginApi.Level(改没改是人的判断,脚本会核对但不代改)
#      ② 本地跑 Set-Version.ps1,连同功能改动一起合进 main
#      ③ 在 GitHub 上发 Release,标签填 v<版本>
#
#    ⚠️ 流水线**不再往回写 main**(原 sync-main 任务已于 2026-08-26 删除)。删它的理由:
#    发版本来就是"改完合进 main → 在 Release 页面发布",版本号在第 ② 步已经落定,
#    回写那一步在正常路径上永远是空操作,只在有人忘了第 ② 步时才有内容 —— 为此常驻一个
#    需要 contents+pull-requests 写权限的 job(还得配 PAT 才能让它开的 PR 亮绿灯),
#    不划算。忘了改的兜底改由 CI 的版本同步体检(`Set-Version.ps1 -Check`)承担:
#    它会在 main 上红一次,照它给的命令跑一遍再补一个 PR 即可。
#
#    下面的 Stamp 步骤**保留**:它只改 runner 上的工作区,保证产物版本号永远等于 Release
#    标签,与仓库里当时提交了什么无关 —— 万一第 ② 步漏了,包也不会以旧版本号推上 nuget.org。
#
# 推送用 **NuGet Trusted Publishing(OIDC)**,不存 API Key:
#   NuGet/login 拿本次运行的 GitHub OIDC 令牌去 nuget.org 换一把**短时效**的推送密钥,
#   用完即弃。密钥不落仓库机密,也就没有"泄漏了要轮换"这件事。
#   ⚠️ 拆库之后 nuget.org 上那五条策略必须改:仓库所有者/仓库名/工作流文件名三项都变了。
#      改法见 docs/release-process.md 的"NuGet 可信发布"一节。
#
# 需要的仓库机密:
#   STRONG_NAME_KEY   与 VelaShell 主仓库**同一把**:Release 下 SDK 程序集要强名称签名,
#                     否则宿主(已签名)引用不了它。(推送本身不再需要任何机密。)
#                     这是本流水线**唯一**需要的机密 —— 原先那个可选的 VERSION_SYNC_TOKEN
#                     随 sync-main 一起删了,仓库机密里若还留着,可以一并清掉。
#
# 发布前会先跑全量测试与**模板端到端冒烟**(装模板 → 生成工程 → 还原 → 构建 → 出 .vpx)。
# 那一步不是形式:插件工程是仓库外环境,仓库内的 Directory.Build.props 一条也吃不到 ——
# 历史上正是它先发现了"SDK 带 RequiresPreviewFeatures,插件工程不开预览开关就全线 CA2252"
# 以及"NuGet 默认不传递 build 资产,导致 Avalonia 的 AXAML 编译器到不了插件工程"这两个坑。
name: Release

on:
  release:
    types: [published]
  # 手动兜底:release 事件没能触发时(主仓库 2026-08-07 遇到过一次),在 Actions 页面
  # 选本工作流 → Run workflow → 填标签即可补跑。推送用 --skip-duplicate、资产上传用
  # `gh release upload --clobber`,对同一标签重复跑是幂等的。
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 Release 标签(如 v1.4.0)'
        required: true
        type: string
      dryRun:
        description: '只打包与冒烟,不推送 nuget.org、不上传 Release 资产'
        required: false
        default: false
        type: boolean

permissions:
  # 只读即可:插件分发物搬去 velashell-plugins 之后,本流水线不再往 Release 上传资产;
  # 版本号回写(原 sync-main)也删了,于是整条流水线没有任何一步需要写仓库。
  contents: read
  # Trusted Publishing 的前提:没有它,NuGet/login 拿不到 OIDC 令牌,换密钥这一步会直接失败。
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name || inputs.tag }}'
          if ([string]::IsNullOrWhiteSpace($tag)) { Write-Error "No release tag available."; exit 1 }
          $version = $tag.TrimStart('v')
          # 版本号必须是合法 SemVer:打错标签(比如 "release-2")的话,下面五个包会以一个
          # 谁也想不到的版本号推上 nuget.org,而 nuget.org 的包版本**不可删除、不可覆盖**。
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            Write-Error "Release tag '$tag' does not resolve to a SemVer version (got '$version'). Use e.g. v1.4.0 or v1.4.0-preview.1."
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing version $version (tag $tag)"

      # ── 把标签里的版本号写进(runner 上的)工作区 ────────────────────────────
      # 正常路径上这一步是**空操作**:版本号在合进 main 之前就由本地那次
      # `pwsh scripts/Set-Version.ps1 <版本>` 落好了。留着它是为了不正常的那次 ——
      # 有人忘了改,或者标签填的版本与 main 里的不一致。放在**构建之前的第一步**,
      # 产物因此永远与 Release 标签一致,与仓库里当时提交了什么无关。
      # 漏一处的后果并不对称:模板漏了会在插件作者的构建期炸 VELA1004;
      # VelaPluginApi.SdkVersion 漏了**什么都不会报错**,只是 `vela-plugin doctor` 从此
      # 汇报一个错的宿主 SDK 版本。
      # ⚠️ 只改工作区,**不回写仓库**:main 若真的落后了,下面 `git diff --stat` 会把它
      #    打出来,同时 main 上的 CI 版本同步体检也会红 —— 照它给的命令本地补一个 PR。
      - name: Stamp version into the repo
        shell: pwsh
        run: |
          & ./scripts/Set-Version.ps1 '${{ steps.version.outputs.version }}'
          # if ($LASTEXITCODE) 而不是 -ne 0:.ps1 不调用 exit 时**不会设置** $LASTEXITCODE,
          # 那时它是 $null —— 而 `$null -ne 0` 为真,会把一次成功判成失败。
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git --no-pager diff --stat

      # 强名称密钥。缺了它 Release 构建会在 CSC 那一步失败(找不到 .snk),
      # 而那条报错离根因很远 —— 这里先给一句人话。
      - name: Restore strong-name key
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SNK_B64)) {
            Write-Error "STRONG_NAME_KEY secret is missing; SDK assemblies must be strong-name signed with the same key as the VelaShell host."
            exit 1
          }
          [IO.File]::WriteAllBytes("VelaShell.snk", [Convert]::FromBase64String($env:SNK_B64))
        env:
          SNK_B64: ${{ secrets.STRONG_NAME_KEY }}

      # ⚠️ 必须是 Debug,别改成 Release:Release 会打开强名签名(见 plugin-sdk/Directory.Build.props),
      #    而签名程序集的 InternalsVisibleTo 必须带友元公钥、友元也得用同一把钥匙签名 ——
      #    测试程序集两条都不满足。这些用例验的是契约与插件逻辑,与优化级别无关,Debug 等价;
      #    且 Debug 的 obj/bin 与下面 Pack 的 Release 目录彼此隔离,
      #    不会把未签名产物混进要发布的包里。
      - name: Test
        shell: pwsh
        run: |
          dotnet test VelaShell.PluginToolchain.slnx -c Debug --nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Pack
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force artifacts/nuget | Out-Null
          $projects = @(
            'plugin-sdk/VelaShell.PluginSdk/VelaShell.PluginSdk.csproj',
            'plugin-sdk/VelaShell.PluginSdk.Testing/VelaShell.PluginSdk.Testing.csproj',
            'tools/VelaShell.Plugin.Cli/VelaShell.Plugin.Cli.csproj',
            'plugin-sdk/VelaShell.PluginSdk.Build/VelaShell.PluginSdk.Build.csproj',
            'templates/VelaShell.Plugin.Templates.csproj'
          )
          foreach ($project in $projects) {
            dotnet pack $project -c Release -o artifacts/nuget -p:VelaSdkVersion=$version --nologo
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Get-ChildItem artifacts/nuget | Select-Object -ExpandProperty Name

      # 端到端冒烟:完全站在插件作者的位置上 —— 从刚打出的包装模板、生成工程、
      # 还原、构建、出 .vpx,最后确认包能被容器读回来。任何一步失败都不该发出去。
      - name: Smoke test (template -> build -> .vpx)
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $feed = (Resolve-Path artifacts/nuget).Path
          $work = Join-Path $env:RUNNER_TEMP 'sdk-smoke'
          New-Item -ItemType Directory -Force $work | Out-Null
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$feed" />
              <add key="nuget" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          "@ | Set-Content (Join-Path $work 'nuget.config')

          dotnet new install "$feed/VelaShell.Plugin.Templates.$version.nupkg"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          try {
            Push-Location $work
            dotnet new velaplugin-ui -n Smoke --publisher ci --authorName "CI" --sdkVersion $version
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Push-Location (Join-Path $work 'Smoke')
            dotnet build -c Release -t:PackVpx --nologo
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $vpx = Get-ChildItem bin/vpx/*.vpx | Select-Object -First 1
            if (-not $vpx) { throw "PackVpx produced no package." }
            # 用刚打出的 CLI 复核一遍容器:魔数、摘要、清单都要读得回来。
            dotnet "$env:GITHUB_WORKSPACE/tools/VelaShell.Plugin.Cli/bin/Release/net11.0/VelaShell.Plugin.Cli.dll" info $vpx.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
            # 插件输出目录里绝不能出现共享程序集 —— 出现了就说明 exclude=Runtime 的链路断了。
            $leaked = Get-ChildItem bin/Release/net11.0 -Filter '*.dll' |
              Where-Object { $_.Name -like 'Avalonia*' -or $_.Name -eq 'VelaShell.PluginSdk.dll' }
            if ($leaked) { throw "Shared assemblies leaked into the plugin output: $($leaked.Name -join ', ')" }
            Pop-Location
            Pop-Location
          } finally {
            dotnet new uninstall VelaShell.Plugin.Templates
          }

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/nuget/*
          if-no-files-found: error

      # Trusted Publishing:用本次运行的 OIDC 身份换一把短时效推送密钥。
      # 换不到密钥基本只有一个原因 —— nuget.org 上那条策略的 Repository / Workflow 字段
      # 还停在拆库之前的值。详见 docs/release-process.md。
      - name: NuGet login (trusted publishing)
        id: nuget-login
        if: ${{ !inputs.dryRun }}
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || 'joes_du' }}

      - name: Push to nuget.org
        if: ${{ !inputs.dryRun }}
        shell: pwsh
        run: |
          # --skip-duplicate:同一版本重跑不算失败(手动补跑是常规操作)。
          # .snupkg 与同名 .nupkg 在同一目录时由 dotnet nuget push 顺带一并推送,无需单列。
          #
          # ⚠️ 通配符必须自己展开:dotnet nuget push **不做 glob 扩展**,把
          #    "artifacts/nuget/*.nupkg" 整个当成文件名去找,报 "File does not exist"
          #    —— 1.0.0-preview.1 的首发就是卡在这一步。
          $packages = @(Get-ChildItem artifacts/nuget/*.nupkg)
          if ($packages.Count -eq 0) { throw "No .nupkg found in artifacts/nuget." }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_TOKEN --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
        env:
          NUGET_TOKEN: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
